name: Sync Upstream & Releases

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/tt-a1i/archify.git

      - name: Fetch upstream
        run: git fetch upstream --tags --force --force

      - name: Sync main branch
        run: |
          set +e
          git checkout main
          git merge upstream/main --ff-only
          if [ $? -ne 0 ]; then
            git merge upstream/main --no-edit
          fi
          # Restore our own .github/workflows/ to avoid GITHUB_TOKEN permission error
          git checkout origin/main -- .github/workflows/ 2>/dev/null || true
          git add .github/workflows/ 2>/dev/null || true
          git commit --amend --no-edit 2>/dev/null || true
          git push origin main
        continue-on-error: true

      - name: Sync tags
        run: |
          git push origin --tags 2>/dev/null || true

      - name: Sync Releases
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const upstreamOwner = 'tt-a1i';
            const upstreamRepo  = 'archify';
            const { owner, repo } = context.repo;

            const upstreamReleases = await github.paginate(
              'GET /repos/{owner}/{repo}/releases',
              { owner: upstreamOwner, repo: upstreamRepo, per_page: 100 }
            );

            if (upstreamReleases.length === 0) {
              core.info('No upstream releases found.');
              return;
            }

            // Process oldest first so the final stable release is also marked latest.
            upstreamReleases.sort(
              (a, b) => new Date(a.published_at) - new Date(b.published_at)
            );

            let created = 0;
            let updated = 0;
            let uploaded = 0;

            for (const rel of upstreamReleases) {
              core.info(`Syncing release: ${rel.tag_name} (${rel.name || rel.tag_name})`);

              let targetRelease;
              try {
                const response = await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag: rel.tag_name
                });
                targetRelease = response.data;
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              const releaseFields = {
                owner,
                repo,
                name: rel.name || rel.tag_name,
                body: rel.body || '',
                draft: false,
                prerelease: rel.prerelease,
                make_latest: rel.prerelease ? 'false' : 'true'
              };

              if (targetRelease) {
                const response = await github.rest.repos.updateRelease({
                  ...releaseFields,
                  release_id: targetRelease.id,
                  tag_name: rel.tag_name
                });
                targetRelease = response.data;
                updated++;
              } else {
                const response = await github.rest.repos.createRelease({
                  ...releaseFields,
                  tag_name: rel.tag_name
                });
                targetRelease = response.data;
                created++;
              }

              const releaseAssets = await github.paginate(
                github.rest.repos.listReleaseAssets,
                {
                  owner,
                  repo,
                  release_id: targetRelease.id,
                  per_page: 100
                }
              );
              const targetAssets = new Map(
                releaseAssets.map(asset => [asset.name, asset])
              );

              for (const asset of rel.assets) {
                const existingAsset = targetAssets.get(asset.name);
                if (existingAsset && existingAsset.size === asset.size) {
                  core.info(`  Asset already current: ${asset.name}`);
                  continue;
                }

                if (existingAsset) {
                  core.info(`  Replacing changed asset: ${asset.name}`);
                  await github.rest.repos.deleteReleaseAsset({
                    owner,
                    repo,
                    asset_id: existingAsset.id
                  });
                }

                const download = await fetch(asset.browser_download_url);
                if (!download.ok) {
                  throw new Error(
                    `Failed to download ${asset.name}: ${download.status} ${download.statusText}`
                  );
                }
                const data = Buffer.from(await download.arrayBuffer());

                await github.rest.repos.uploadReleaseAsset({
                  owner,
                  repo,
                  release_id: targetRelease.id,
                  name: asset.name,
                  label: asset.label || undefined,
                  data,
                  headers: {
                    'content-type': asset.content_type || 'application/octet-stream',
                    'content-length': data.length
                  }
                });
                core.info(`  Uploaded asset: ${asset.name}`);
                uploaded++;
              }
            }

            core.info(
              `Release sync complete: ${created} created, ${updated} updated, ${uploaded} assets uploaded.`
            );
